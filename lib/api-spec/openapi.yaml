openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Trademark Monitoring Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: clients
  - name: monitoring
  - name: alerts
  - name: domains
  - name: assessment
  - name: logo
  - name: social
  - name: proprietor
  - name: license
  - name: opposition
  - name: products
  - name: billing
  - name: organizations
  - name: settings
  - name: groups
  - name: templates
  - name: reporting
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user info
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Dashboard ─────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /dashboard/records-count:
    get:
      operationId: getRecordsCount
      tags: [dashboard]
      summary: Chart records count
      responses:
        "200":
          description: Records count data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsCount"

  # ── Users ─────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, all]
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user permanently
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [users]
      summary: Suspend user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /users/{id}/restore:
    post:
      operationId: restoreUser
      tags: [users]
      summary: Restore user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /users/{id}/limits:
    get:
      operationId: getUserLimits
      tags: [users]
      summary: Get user limits
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLimitsResponse"
    put:
      operationId: setUserLimit
      tags: [users]
      summary: Set user limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLimitBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /users/profile:
    get:
      operationId: getProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /users/allowed-countries:
    get:
      operationId: getAllowedCountries
      tags: [users]
      summary: Get allowed countries for current user
      responses:
        "200":
          description: Countries
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /users/my-limits:
    get:
      operationId: getMyLimits
      tags: [users]
      summary: Get current user limits with usage
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLimitsResponse"
  /users/{id}/group:
    put:
      operationId: setUserGroup
      tags: [users]
      summary: Set user group (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserGroupBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  # ── User menu groups (admin) ─────────────────────
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups (admin)
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create group (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "409":
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /groups/{id}:
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update group (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Name conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete group (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  # ── Clients ───────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Add client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /clients/{id}:
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Remove client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── TM Watch (Monitoring) ─────────────────────────
  /monitoring/keywords:
    get:
      operationId: listMonitoringKeywords
      tags: [monitoring]
      summary: List monitoring keywords
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: country
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Keywords
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMonitoringKeywords"
    post:
      operationId: addMonitoringKeyword
      tags: [monitoring]
      summary: Add monitoring keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddKeywordBody"
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /monitoring/keywords/{id}:
    delete:
      operationId: deleteMonitoringKeyword
      tags: [monitoring]
      summary: Remove keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /monitoring/keywords/{id}/requeue-scopes:
    post:
      operationId: requeueMonitoringKeywordScopes
      tags: [monitoring]
      summary: Remove existing scopes for keyword and enqueue fresh ones
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scopes re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /monitoring/results:
    get:
      operationId: listMonitoringResults
      tags: [monitoring]
      summary: List monitoring results
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: country
          in: query
          description: Source country(s); comma-separated for OR (PHP multi-select)
          schema:
            type: string
        - name: journalDate
          in: query
          schema:
            type: string
        - name: journalDates
          in: query
          description: Comma-separated journal dates (OR)
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
        - name: clientIds
          in: query
          description: Comma-separated client ids (OR)
          schema:
            type: string
        - name: keywordId
          in: query
          schema:
            type: integer
        - name: keywords
          in: query
          description: Comma-separated watch keywords (exact match on monitoring_keywords.keyword)
          schema:
            type: string
        - name: classFilter
          in: query
          description: Comma-separated Nice class numbers; filters conflict_class (PHP)
          schema:
            type: string
        - name: conflictClasses
          in: query
          schema:
            type: string
        - name: conflict
          in: query
          description: Substring match on conflict tm applied for
          schema:
            type: string
        - name: conflictAppno
          in: query
          schema:
            type: string
        - name: scores
          in: query
          description: Comma-separated 100,90,80,70 bucket filters
          schema:
            type: string
        - name: sortBy
          in: query
          description: Column to sort by (PHP TM Watch default journalDate desc)
          schema:
            type: string
            enum:
              - journalDate
              - sourceKeyword
              - country
              - conflict
              - appno
              - class
              - client
              - score
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMonitoringResults"
  /monitoring/results/{id}/favorite:
    post:
      operationId: toggleMonitoringResultFavorite
      tags: [monitoring]
      summary: Toggle favorite star (PHP ViewResults favorite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringResultFavoriteToggle"
        "403":
          description: Forbidden
        "404":
          description: Not found
  /monitoring/results/export:
    post:
      operationId: exportMonitoringResults
      tags: [monitoring]
      summary: Export monitoring results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBody"
      responses:
        "200":
          description: Export file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
  /monitoring/import:
    post:
      operationId: importMonitoringKeywords
      tags: [monitoring]
      summary: Import keywords from file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tmname:
                  type: string
                class:
                  type: string
                country:
                  type: string
                client:
                  type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
  /monitoring/filters:
    get:
      operationId: getMonitoringFilters
      tags: [monitoring]
      summary: Get available filter values
      responses:
        "200":
          description: Filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringFilters"

  # ── Alerts ────────────────────────────────────────
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SearchParam"
        - name: type
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAlerts"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlertBody"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /alerts/results:
    get:
      operationId: listAlertResults
      tags: [alerts]
      summary: List alert results
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: alertId
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAlertResults"
  /alerts/results/export:
    post:
      operationId: exportAlertResults
      tags: [alerts]
      summary: Export alert results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBody"
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
  /alerts/filters:
    get:
      operationId: getAlertFilters
      tags: [alerts]
      summary: Get alert filter values
      responses:
        "200":
          description: Filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertFilters"

  # ── Domain Monitoring ─────────────────────────────
  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List domains
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDomains"
    post:
      operationId: addDomain
      tags: [domains]
      summary: Add domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDomainBody"
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /domains/{id}:
    delete:
      operationId: deleteDomain
      tags: [domains]
      summary: Remove domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /domains/results:
    get:
      operationId: listDomainResults
      tags: [domains]
      summary: List domain results
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - name: domainId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedDomainResults"
  /domains/results/export:
    post:
      operationId: exportDomainResults
      tags: [domains]
      summary: Export domain results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportBody"
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"

  # ── Assessment ────────────────────────────────────
  /assessment:
    post:
      operationId: searchAssessment
      tags: [assessment]
      summary: Search assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSearchBody"
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
  /assessment/export:
    post:
      operationId: exportAssessment
      tags: [assessment]
      summary: Export assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentExportBody"
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
  /assessment/risk-scoring:
    post:
      operationId: getRiskScoring
      tags: [assessment]
      summary: Get risk scoring data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
              required:
                - keyword
      responses:
        "200":
          description: Risk data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskScoringResponse"

  # ── Logo Watch ────────────────────────────────────
  /logo:
    get:
      operationId: listLogoSearches
      tags: [logo]
      summary: List logo searches
      parameters:
        - $ref: "#/components/parameters/PageParam"
      responses:
        "200":
          description: Logo searches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLogoSearches"
    post:
      operationId: addLogoSearch
      tags: [logo]
      summary: Add logo search
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                clientId:
                  type: integer
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /logo/{id}:
    delete:
      operationId: deleteLogoSearch
      tags: [logo]
      summary: Delete logo search
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":

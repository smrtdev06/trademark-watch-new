components:
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    SearchParam:
      name: search
      in: query
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required: [status, message]

    ErrorMessage:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      required: [message]

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
      required: [name, email, password]

    AuthResponse:
      type: object
      properties:
        status:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        groupId:
          type: integer
          nullable: true
        groupPermissions:
          type: object
          additionalProperties:
            type: boolean
          nullable: true
        emailVerifiedAt:
          type: string
          nullable: true
        mobileVerifiedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        deletedAt:
          type: string
          nullable: true
        profile:
          $ref: "#/components/schemas/UserProfileData"
      required: [id, name, email, role]

    UserProfileData:
      type: object
      properties:
        organization:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        pincode:
          type: string
        country:
          type: string
        gstNumber:
          type: string
        organizationType:
          type: string
        designation:
          type: string

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, perPage, totalPages]

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
      required: [name, email, password]

    SetUserGroupBody:
      type: object
      properties:
        groupId:
          type: integer
          nullable: true
      required: [groupId]

    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        menuPermissions:
          type: object
          additionalProperties:
            type: boolean
        createdAt:
          type: string
      required: [id, name, menuPermissions, createdAt]

    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
        menuPermissions:
          type: object
          additionalProperties:
            type: boolean
      required: [name]

    UpdateGroupBody:
      type: object
      properties:
        name:
          type: string
        menuPermissions:
          type: object
          additionalProperties:
            type: boolean

    SetLimitBody:
      type: object
      properties:
        name:
          type: string
        value:
          type: integer
      required: [name, value]

    UserLimitsResponse:
      type: object
      properties:
        limits:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: integer
            required: [name, value]
        used:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: integer
            required: [name, value]
      required: [limits, used]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        organization:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        pincode:
          type: string
        country:
          type: string
        gstNumber:
          type: string
        organizationType:
          type: string
        designation:
          type: string
      required: [id, userId]

    UpdateProfileBody:
      type: object
      properties:
        organization:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        pincode:
          type: string
        country:
          type: string
        gstNumber:
          type: string
        organizationType:
          type: string
        designation:
          type: string
        companyName:
          type: string
        address:
          type: string
        pdfLogo:
          type: string

    DashboardStats:
      type: object
      properties:
        usersCount:
          type: integer
        alertsCount:
          type: integer
        keywordsCount:
          type: integer
        clientsCount:
          type: integer
        logoCount:
          type: integer
        latestJournal:
          type: string
        latestCountry:
          type: string
        domainsCount:
          type: integer
        socialKeywordsCount:
          type: integer
      required: [alertsCount, keywordsCount, clientsCount, logoCount, latestJournal, latestCountry]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string
        metadata:
          type: object
      required: [id, type, description, createdAt]

    RecordsCount:
      type: object
      properties:
        monitoring:
          type: integer
        alerts:
          type: integer
        domains:
          type: integer
        social:
          type: integer
        logos:
          type: integer
      required: [monitoring, alerts, domains, social, logos]

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email1:
          type: string
        email2:
          type: string
        email3:
          type: string
        phone1:
          type: string
        phone2:
          type: string
        phone3:
          type: string
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        country:
          type: string
        city:
          type: string
        pincode:
          type: string
        clientType:
          type: string
        preferredContactType:
          type: string
        allowControlPanel:
          type: boolean
        userId:
          type: integer
        userName:
          type: string
        userEmail:
          type: string
        createdAt:
          type: string
      required: [id, name]

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        email1:
          type: string
        email2:
          type: string
        email3:
          type: string
        phone1:
          type: string
        phone2:
          type: string
        phone3:
          type: string
        address1:
          type: string
        address2:
          type: string
        address3:
          type: string
        country:
          type: string
        city:
          type: string
        pincode:
          type: string
        clientType:
          type: string
        preferredContactType:
          type: string
          enum: [email, sms, both]
        allowControlPanel:
          type: boolean
      required: [name]

    MonitoringKeyword:
      type: object
      properties:
        id:
          type: integer
        keyword:
          type: string
        country:
          type: string
        class:
          type: string
        userId:
          type: integer
        clientId:
          type: integer
        clientName:
          type: string
        userName:
          type: string
        userEmail:
          type: string
        createdAt:
          type: string
      required: [id, keyword, country, class]

    PaginatedMonitoringKeywords:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringKeyword"
        total:
          type: integer
        page:
          type: integer
        perPage:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, perPage, totalPages]

    AddKeywordBody:
      type: object
      properties:
        keyword:
          type: string
        country:
          type: string
        class:
          type: string
        clientId:
          type: integer
      required: [keyword, country, class, clientId]

    MonitoringResult:
      type: object
      properties:
        id:
          type: integer
        keywordId:
          type: integer
        keyword:
          type: string
        sourceKeyword:
          type: string
          description: monitoring_keywords.keyword (PHP Keyword column)
        wordToCompare:
          type: string
        appno:
          type: string
        journalDate:
          type: string
        score:
          type: number
        scoreLabel:
          type: string
          description: Very High / High / Medium / Low (PHP MonitoringScoreForHumans)
        conflictClass:
          type: string
        conflictClassDisplay:
          type: string
          description: Pipes replaced with comma-space for display
        conflictCountry:
          type: string
        conflictStatus:
          type: string
        tmAppliedFor:
          type: string
        userDetail:
          type: string
        country:
          type: string
        class:
          type: string
        clientName:
          type: string
        userName:
          type: string
